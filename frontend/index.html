<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simplotel AI Concierge helps hotel guests ask questions, view dining and room options, and check room availability."
    />
    <meta name="theme-color" content="#03042f" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>Simplotel - AI Concierge Assistant</title>
    <style>
      body {
        margin: 0;
        background: #f9f8f2;
        color: #111331;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .initial-shell-header {
        display: flex;
        height: 80px;
        align-items: center;
        justify-content: center;
        background: #03042f;
        color: #fff;
      }
      .initial-shell-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .initial-shell-subtitle {
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-align: center;
      }
      .initial-shell-main {
        padding: 32px 20px;
      }
      .initial-shell-message {
        max-width: 680px;
        border-radius: 20px 20px 20px 4px;
        background: #fff;
        padding: 20px;
        box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
        font-size: 15px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-shell-header">
        <div>
          <div class="initial-shell-title">Simplotel</div>
          <div class="initial-shell-subtitle">AI CONCIERGE</div>
        </div>
      </div>
      <main class="initial-shell-main">
        <p class="initial-shell-message">
          Welcome! I'm Simplotel, your concierge assistant. Select an option from the list or type in a message to get started.
        </p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
